services:
  - type: web
    name: workshop-planner
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-planner-db
          property: connectionString

databases:
  - name: workshop-planner-db
    plan: free
    region: frankfurt
    databaseName: workshop
    user: workshop_user
